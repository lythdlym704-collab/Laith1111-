name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find or extract project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          find_project() {
            find "$1" \
              -type f \
              ( -name settings.gradle -o -name settings.gradle.kts ) \
              -not -path '*/.git/*' \
              -not -path '*/.gradle/*' \
              -print0 |
            while IFS= read -r -d '' settings; do
              folder="$(dirname "$settings")"

              if [ -f "$folder/app/build.gradle" ] ||
                 [ -f "$folder/app/build.gradle.kts" ]; then
                printf '%s
' "$folder"
              fi
            done
          }

          mapfile -t projects < <(find_project "$GITHUB_WORKSPACE")

          if [ "${#projects[@]}" -eq 0 ]; then
            archive="$(
              find "$GITHUB_WORKSPACE" \
                -type f \
                -name 'ScriptApkBuilder-Complete.zip' \
                -print -quit
            )"

            if [ -z "$archive" ]; then
              echo "::error::Project files not found. Upload ScriptApkBuilder-Complete.zip or extract the project files into the repository."
              echo "Files currently uploaded:"
              find "$GITHUB_WORKSPACE" -maxdepth 3 -type f
              exit 1
            fi

            extracted="$RUNNER_TEMP/extracted-project"
            mkdir -p "$extracted"
            unzip -q "$archive" -d "$extracted"

            mapfile -t projects < <(find_project "$extracted")
          fi

          if [ "${#projects[@]}" -ne 1 ]; then
            echo "::error::Expected one Android project, but found ${#projects[@]}."
            printf '%s
' "${projects[@]}"
            exit 1
          fi

          echo "Using project: ${projects[0]}"
          echo "dir=${projects[0]}" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          gradle \
            --project-dir "$PROJECT_DIR" \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Collect APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk \
             "$GITHUB_WORKSPACE/apk-output/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScriptAPK-debug
          path: apk-output/*.apk
          if-no-files-found: error
